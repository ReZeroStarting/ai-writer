server:
  port: 8080

spring:
  application:
    name: ai-writer
  datasource:
    url: jdbc:mysql://localhost:3306/ai_writer?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# AI 上游选择：anthropic（缺省）或 deepseek
ai:
  provider: ${AI_PROVIDER:anthropic}
  # 用户自带 API Key 的落库加密密钥；不单独配就用 JWT_SECRET 派生
  key-secret: ${AI_KEY_SECRET:${JWT_SECRET:}}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  base-url: https://api.anthropic.com
  model: claude-sonnet-4-6
  temperature: 0.7
  max-tokens: 4096

# 仅当 ai.provider=deepseek 时生效，走 DeepSeek 原生 OpenAI 兼容协议
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  model: deepseek-flash
  temperature: 0.7
  max-tokens: 4096

jwt:
  secret: ${JWT_SECRET:}
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000
